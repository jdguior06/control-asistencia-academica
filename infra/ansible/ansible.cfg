# Configuración de Ansible del proyecto final.
# Ejecuta los comandos DENTRO de esta carpeta (infra/ansible).

[defaults]
# El inventario se elige en cada comando:
#   -i inventarios/plataforma.ini      (lo escribe infra/plataforma)
#   -i inventarios/<slug>.ini          (lo escribe scripts/inventario.py)
private_key_file = ~/.ssh/id_ed25519
vault_password_file = ~/.vault_asistencia
# Las IPs cambian cada vez que se recrean los servidores: no guardar ni verificar huellas SSH.
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10
timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30 -o UserKnownHostsFile=/dev/null
