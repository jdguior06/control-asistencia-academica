# Configura la plataforma que crea infra/plataforma (Terraform):
#   vm-plataforma  base del portal, portal (Admin-institucional) y gateway Nginx
#   vm-monitoreo   Prometheus y Grafana
#
#   ansible-playbook -i inventarios/plataforma.ini plataforma.yml
#
# Se puede ejecutar todas las veces que quieras: solo cambia lo que hace falta.

- name: Esperar a que los servidores estén listos
  hosts: all
  gather_facts: false
  tasks:
    - name: Esperar a que responda SSH
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Esperar a que termine el primer arranque (cloud-init)
      ansible.builtin.command: cloud-init status --wait
      become: true
      register: estado_cloud_init
      changed_when: false
      failed_when: estado_cloud_init.rc not in [0, 2] # 2 = terminó con avisos

    # El loop recorre solo los NOMBRES: el valor nunca aparece en pantalla.
    - name: Comprobar los secretos de Vault (solo letras y números)
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.vars', item, default='') is regex('^[A-Za-z0-9]{12,}$')
        fail_msg: >-
          Falta {{ item }} en group_vars/all/vault.yml, o no sirve: 12 o más
          caracteres, solo letras y números. Ver vault.yml.ejemplo.
        quiet: true
      loop: [vault_portal_admin_password, vault_portal_db_password, vault_grafana_password]
      run_once: true

- name: Configuración común y métricas del sistema
  hosts: all
  become: true
  tasks:
    - name: Comun
      ansible.builtin.import_tasks: tareas/comun.yml
    - name: Node_exporter
      ansible.builtin.import_tasks: tareas/node_exporter.yml
  handlers:
    - name: Reinicios
      ansible.builtin.import_tasks: tareas/handlers.yml

- name: Portal y gateway
  hosts: plataforma
  become: true
  vars:
    postgresql_escuchar: localhost
    postgresql_accesos:
      - base: "{{ portal_db_nombre }}"
        usuario: "{{ portal_db_usuario }}"
        password: "{{ portal_db_password }}"
        desde: 127.0.0.1/32
  tasks:
    - name: Postgresql
      ansible.builtin.import_tasks: tareas/postgresql.yml
    - name: Nodejs
      ansible.builtin.import_tasks: tareas/nodejs.yml
    - name: Codigo
      ansible.builtin.import_tasks: tareas/codigo.yml
    - name: Portal
      ansible.builtin.import_tasks: tareas/portal.yml
    - name: Gateway
      ansible.builtin.import_tasks: tareas/gateway.yml
  handlers:
    - name: Reinicios
      ansible.builtin.import_tasks: tareas/handlers.yml

- name: Prometheus y Grafana
  hosts: monitoreo
  become: true
  tasks:
    - name: Prometheus
      ansible.builtin.import_tasks: tareas/prometheus.yml
    - name: Grafana
      ansible.builtin.import_tasks: tareas/grafana.yml
  handlers:
    - name: Reinicios
      ansible.builtin.import_tasks: tareas/handlers.yml

- name: Resumen
  hosts: plataforma
  gather_facts: false
  tasks:
    - name: Direcciones
      ansible.builtin.debug:
        msg:
          - "Portal:     http://{{ ansible_host }}  ({{ portal_admin_email }}, contraseña vault_portal_admin_password)"
          - "Grafana:    http://{{ hostvars[groups['monitoreo'][0]]['ansible_host'] }}:{{ grafana_puerto }}  (admin, contraseña vault_grafana_password)"
          - "Prometheus: http://{{ hostvars[groups['monitoreo'][0]]['ansible_host'] }}:{{ prometheus_puerto }}/targets"
          - "Tenants:    http://<slug>.{{ dominio }}"
