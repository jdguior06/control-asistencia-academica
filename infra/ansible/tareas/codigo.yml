# codigo: usuario de las apps y código desde GitHub (portal, frontend y backend).
# Deja registrado "codigo_git": si cambió, hay que recompilar.

- name: Usuario del sistema para las apps (sin acceso por SSH)
  ansible.builtin.user:
    name: "{{ app_usuario }}"
    system: true
    home: "{{ app_home }}"
    create_home: true
    shell: /sbin/nologin

- name: Clonar o actualizar el repositorio
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_rama }}"
    depth: 1
  become: true
  become_user: "{{ app_usuario }}"
  register: codigo_git

- name: Versión desplegada
  ansible.builtin.debug:
    msg: "Commit {{ codigo_git.after[:7] }}{{ ' (nuevo)' if codigo_git is changed else ' (sin cambios)' }}"
