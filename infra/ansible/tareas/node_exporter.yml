# node_exporter: métricas del sistema (CPU, memoria, disco, red y estado de los servicios).

- name: Usuario del sistema node_exporter
  ansible.builtin.user:
    name: node_exporter
    system: true
    shell: /sbin/nologin
    create_home: false

- name: Descargar y descomprimir node_exporter {{ node_exporter_version }}
  ansible.builtin.unarchive:
    src: "{{ node_exporter_url }}"
    dest: /opt
    remote_src: true
    creates: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"

# Cada versión queda en su carpeta; el enlace apunta a la que está en uso.
- name: Usar la versión instalada
  ansible.builtin.file:
    src: "/opt/node_exporter-{{ node_exporter_version }}.linux-amd64/node_exporter"
    dest: /usr/local/bin/node_exporter
    state: link
  notify: Reiniciar node_exporter

- name: Servicio systemd de node_exporter
  ansible.builtin.copy:
    dest: /etc/systemd/system/node_exporter.service
    mode: "0644"
    content: |
      # Administrado por Ansible (infra/ansible). No editar a mano.
      [Unit]
      Description=Prometheus node_exporter (metricas del sistema)
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=node_exporter
      # --collector.systemd: publica si cada servicio de la lista está activo o caído.
      ExecStart=/usr/local/bin/node_exporter \
        --web.listen-address=:{{ node_exporter_puerto }} \
        --collector.systemd \
        --collector.systemd.unit-include=({{ servicios_vigilados | join('|') }})[.]service
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: Reiniciar node_exporter

- name: Node_exporter activo al arrancar
  ansible.builtin.systemd:
    name: node_exporter
    state: started
    enabled: true
    daemon_reload: true
