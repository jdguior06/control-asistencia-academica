# netdata: panel en tiempo real (cada segundo) del servidor, en el puerto 19999.
# Prometheus también lee sus métricas generales.

- name: Comprobar si Netdata ya está instalado
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/sbin/netdata          # paquete nativo
    - /opt/netdata/bin/netdata   # instalación estática
  register: netdata_binarios

- name: Instalar Netdata (instalador oficial)
  when: netdata_binarios.results | selectattr('stat.exists') | list | length == 0
  block:
    - name: Descargar el instalador
      ansible.builtin.get_url:
        url: https://get.netdata.cloud/kickstart.sh
        dest: /tmp/netdata-kickstart.sh
        mode: "0755"

    - name: Ejecutar el instalador (sin telemetría ni actualizaciones automáticas)
      ansible.builtin.command: >-
        sh /tmp/netdata-kickstart.sh --non-interactive --stable-channel
        --disable-telemetry --no-updates
      changed_when: true

- name: Carpeta de configuración (paquete o instalación estática)
  ansible.builtin.stat:
    path: /etc/netdata
  register: netdata_etc

- name: Configuración de Netdata
  ansible.builtin.copy:
    dest: "{{ '/etc/netdata' if netdata_etc.stat.exists else '/opt/netdata/etc/netdata' }}/netdata.conf"
    mode: "0644"
    content: |
      # Administrado por Ansible (infra/ansible). No editar a mano.
      # Ajustes para servidores pequeños: poca memoria y sin aprendizaje automático.
      [global]
          hostname = {{ inventory_hostname }}

      [db]
          update every = 1
          mode = dbengine
          storage tiers = 1
          dbengine tier 0 retention size = 256MiB
          dbengine tier 0 retention time = 1d

      [ml]
          enabled = no

      [web]
          bind to = *:{{ netdata_puerto }}
  notify: Reiniciar Netdata

- name: Netdata activo al arrancar
  ansible.builtin.systemd:
    name: netdata
    state: started
    enabled: true
